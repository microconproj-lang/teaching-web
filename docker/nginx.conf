# ============================================================================
# Nginx Configuration — ปรับแต่งสำหรับ Classroom Burst & Pi 5
# ============================================================================

upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
}

# ป้องกันการยิง API ส่งคำตอบรัวเกินเหตุ (10 req/sec ต่อ IP, burst 20)
limit_req_zone $binary_remote_addr zone=api_submit_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Security Headers พื้นฐาน
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression ลดขนาดข้อมูลบน Wi-Fi ห้องเรียน
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # เสิร์ฟเกม HTML5 (sandbox_iframe) และ Pyodide WASM จาก Nginx โดยตรงพร้อม Cache ยาว
    location /games/ {
        alias /usr/share/nginx/html/games/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    location /pyodide/ {
        alias /usr/share/nginx/html/pyodide/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Static assets ของ Next.js
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rate limit เฉพาะ Endpoint ส่งคำตอบ/ตรวจคะแนน
    location ~ ^/api/modules/.+/submit$ {
        limit_req zone=api_submit_limit burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Proxy คำขอทั้งหมดไปที่ Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

